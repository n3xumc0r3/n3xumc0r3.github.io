name: Sync from py-underhood

on:
  schedule:
    # Каждые 30 минут — подхватывает изменения из py-underhood
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch/tag/SHA in py-underhood to sync from'
        required: false
        default: 'main'
  repository_dispatch:
    types: [sync-from-py-underhood]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo (user-pages)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: user-pages

      - name: Configure git
        run: |
          cd user-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Checkout source repo (py-underhood)
        uses: actions/checkout@v4
        with:
          repository: n3xumc0r3/py-underhood
          ref: ${{ github.event.client_payload.ref || github.event.inputs.ref || 'main' }}
          path: py-underhood
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: py-underhood/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r py-underhood/requirements.txt

      - name: Build site
        run: |
          cd py-underhood
          mkdocs build --strict

      - name: Sync site into user-pages repo
        run: |
          cd user-pages
          # Remove all existing files (except .git AND .github — keep workflows!)
          find . -mindepth 1 -maxdepth 1 -not -name '.git' -not -name '.github' -exec rm -rf {} +
          # Copy new site content
          cp -a ../py-underhood/site/. ./
          # Verify key files exist
          ls -la | head -10
          echo "---"
          test -f index.html && echo "OK: index.html present"
          test -f sitemap.xml && echo "OK: sitemap.xml present"
          test -f robots.txt && echo "OK: robots.txt present"

      - name: Commit and push
        id: commit
        run: |
          cd user-pages
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy."
            echo "pushed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Auto-sync from n3xumc0r3/py-underhood@${{ github.event.client_payload.ref || github.event.inputs.ref || 'main' }}

            Triggered by: ${{ github.event_name }}
            Source: https://github.com/n3xumc0r3/py-underhood"
            git push origin main
            echo "pushed=true" >> $GITHUB_OUTPUT
          fi

      - name: Notify IndexNow (Bing + Yandex)
        # Отправляем уведомление только если сайт реально обновился
        if: steps.commit.outputs.pushed == 'true'
        run: |
          # IndexNow key (должен совпадать с файлом {key}.txt в корне сайта)
          INDEXNOW_KEY="bd0f5b3ecea6f236b356633825d556c1"
          HOST="n3xumc0r3.github.io"
          KEY_LOCATION="https://${HOST}/${INDEXNOW_KEY}.txt"

          # Ждём 90 сек — Pages build запускается асинхронно после push,
          # и нам нужно, чтобы новый sitemap + key file стали доступны.
          echo "Waiting 90s for GitHub Pages build to complete..."
          sleep 90

          # Собираем все URL из sitemap (нового, уже запушенного)
          echo "Fetching sitemap from https://${HOST}/sitemap.xml ..."
          SITEMAP_XML=$(curl -sS "https://${HOST}/sitemap.xml")

          # Извлекаем URL, фильтруем 404.html
          URL_LIST=$(echo "$SITEMAP_XML" | \
            grep -oE "<loc>https://[^<]+</loc>" | \
            sed -E 's|</?loc>||g' | \
            grep -v "404.html" | \
            jq -R . | jq -s .)

          URL_COUNT=$(echo "$URL_LIST" | jq length)
          echo "URLs to notify: $URL_COUNT"
          echo "$URL_LIST" | jq -r '.[]' | head -5 | sed 's/^/  - /'

          if [ "$URL_COUNT" -eq 0 ]; then
            echo "WARN: No URLs found in sitemap — skipping IndexNow notification"
            exit 0
          fi

          # Проверяем, что key file доступен (с 3 ретраями)
          echo "Verifying key file at $KEY_LOCATION ..."
          KEY_OK=false
          for attempt in 1 2 3; do
            KEY_RESPONSE=$(curl -sS -w "%{http_code}" -o /tmp/key_response.txt "$KEY_LOCATION")
            echo "Attempt $attempt: Key file HTTP: $KEY_RESPONSE"
            if [ "$KEY_RESPONSE" = "200" ]; then
              KEY_CONTENT=$(cat /tmp/key_response.txt | tr -d '[:space:]')
              if [ "$KEY_CONTENT" = "$INDEXNOW_KEY" ]; then
                echo "OK: Key file verified"
                KEY_OK=true
                break
              fi
            fi
            echo "Key file not ready, waiting 30s..."
            sleep 30
          done

          if [ "$KEY_OK" != "true" ]; then
            echo "WARN: Key file not accessible after 3 attempts"
            echo "  IndexNow may still work — search engines will verify keyLocation async"
            echo "  Proceeding with notification anyway..."
          fi

          # Отправляем POST на IndexNow
          # IndexNow принимает запросы на api.indexnow.org (общий эндпоинт)
          # — он ретранслирует во все поддерживающие поисковики автоматически
          # (Bing, Yandex, Seznam).
          echo "Sending IndexNow notification..."
          PAYLOAD=$(jq -n \
            --arg host "$HOST" \
            --arg key "$INDEXNOW_KEY" \
            --arg keyLocation "$KEY_LOCATION" \
            --argjson urlList "$URL_LIST" \
            '{host: $host, key: $key, keyLocation: $keyLocation, urlList: $urlList}')

          echo "Payload (first 10 lines):"
          echo "$PAYLOAD" | jq . | head -10
          echo "..."

          HTTP_CODE=$(curl -sS -o /tmp/indexnow_response.txt -w "%{http_code}" \
            -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          echo "IndexNow response HTTP: $HTTP_CODE"
          echo "Response body:"
          cat /tmp/indexnow_response.txt
          echo ""

          # 200 = OK, 202 = Accepted — оба означают успех
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "202" ]; then
            echo "OK: IndexNow notified successfully"
          else
            echo "WARN: IndexNow returned $HTTP_CODE — notification may have failed"
            echo "  (это не критично — поисковики всё равно придут по sitemap)"
          fi
